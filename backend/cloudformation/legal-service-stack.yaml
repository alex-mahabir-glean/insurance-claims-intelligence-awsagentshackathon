AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation stack for AI-Powered Legal Service Management System.
  AWS AI Agent Global Hackathon 2025 submission.
  Includes DynamoDB tables, Lambda functions, API Gateway, and AgentCore integration.

Parameters:
  DeploymentID:
    Type: String
    Description: A unique identifier for the deployment
    Default: 'legal'

Resources:
  # Secrets Manager Secret for API Token
  ApiTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "LegalService/ApiToken/${DeploymentID}"
      Description: "API Token for Glean Actions authentication"
      GenerateSecretString:
        SecretStringTemplate: '{"token": ""}'
        GenerateStringKey: 'token'
        PasswordLength: 32
        ExcludeCharacters: '"@/\\`()~,;:$|&<>#+_{}[]*'

  # DynamoDB Tables
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LegalService-Claims-${DeploymentID}"
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: assignedTo
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: AssignedToIndex
          KeySchema:
            - AttributeName: assignedTo
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  ReviewersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LegalService-Reviewers-${DeploymentID}"
      AttributeDefinitions:
        - AttributeName: reviewerId
          AttributeType: S
      KeySchema:
        - AttributeName: reviewerId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  AuditTrailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "LegalService-AuditTrail-${DeploymentID}"
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # =============================================================================
  # IAM Role for AgentCore Runtime
  # =============================================================================
  # This role is used by the AgentCore agents when they execute
  # It needs permissions to access DynamoDB, Bedrock, and other AWS services
  AgentCoreRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "LegalService-AgentCoreRuntimeRole-${DeploymentID}"
      Description: "Execution role for Bedrock AgentCore agents with DynamoDB access"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ClaimsTable.Arn
                  - !GetAtt ReviewersTable.Arn
                  - !GetAtt AuditTrailTable.Arn
                  - !Sub "${ClaimsTable.Arn}/index/*"
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - "arn:aws:bedrock:*:*:inference-profile/*"
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
        - PolicyName: XRayAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: "bedrock-agentcore"
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/bedrock-agentcore-*"

  # IAM Role for Lambda Functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "LegalService-LambdaRole-${DeploymentID}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ClaimsTable.Arn
                  - !GetAtt ReviewersTable.Arn
                  - !GetAtt AuditTrailTable.Arn
                  - !Sub "${ClaimsTable.Arn}/index/*"
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                  - bedrock:InvokeModel
                  - bedrock-agent-runtime:InvokeAgent
                Resource: "*"
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ApiTokenSecret

  # Lambda Functions
  SubmitClaimFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-SubmitClaim-${DeploymentID}"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          REVIEWERS_TABLE: !Ref ReviewersTable
          AUDIT_TABLE: !Ref AuditTrailTable
          INTAKE_AGENT_ID: "PLACEHOLDER_INTAKE_AGENT"
          ASSIGNMENT_AGENT_ID: "PLACEHOLDER_ASSIGNMENT_AGENT"
          REVIEW_AGENT_ID: "PLACEHOLDER_REVIEW_AGENT"
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          from decimal import Decimal

          dynamodb = boto3.resource('dynamodb')
          claims_table = dynamodb.Table(os.environ['CLAIMS_TABLE'])

          def generate_ai_analysis(claim_value, claim_type, injuries, description):
              """Generate AI recommendation based on claim details"""
              import random
              
              # Simple AI logic based on claim characteristics
              risk_score = 0
              risk_factors = []
              
              # Check claim value
              if claim_value > 20000:
                  risk_score += 0.3
                  risk_factors.append("High claim value")
              elif claim_value > 10000:
                  risk_score += 0.15
                  risk_factors.append("Moderate claim value")
              
              # Check for injuries
              if injuries:
                  risk_score += 0.2
                  risk_factors.append("Injuries reported")
              
              # Check description length (proxy for documentation quality)
              if len(description) < 50:
                  risk_score += 0.15
                  risk_factors.append("Limited documentation")
              
              # Determine recommendation
              if risk_score < 0.3:
                  recommendation = "approve"
                  confidence = round(random.uniform(0.88, 0.95), 2)
                  reasoning = f"Low risk {claim_type} claim with adequate documentation"
              elif risk_score < 0.5:
                  recommendation = "approve"
                  confidence = round(random.uniform(0.75, 0.88), 2)
                  reasoning = f"Moderate risk {claim_type} claim, documentation appears complete"
              else:
                  recommendation = "deny"
                  confidence = round(random.uniform(0.70, 0.85), 2)
                  reasoning = f"High risk {claim_type} claim, recommend additional review or denial"
                  risk_factors.append("Multiple risk factors present")
              
              return {
                  'recommendation': recommendation,
                  'confidence': str(confidence),
                  'reasoning': reasoning,
                  'riskFactors': risk_factors
              }

          def lambda_handler(event, context):
              try:
                  body = json.loads(event.get('body', '{}'))
                  
                  # Generate claim ID
                  timestamp = datetime.utcnow()
                  claim_id = f"CL-{timestamp.strftime('%Y-%m%d%H%M%S')}"
                  
                  # Extract claim details
                  claim_value = float(body.get('claimValue', 0))
                  claim_type = body.get('claimType', '')
                  injuries = body.get('injuries', False)
                  description = body.get('incidentDescription', '')
                  
                  # Generate AI analysis
                  ai_analysis = generate_ai_analysis(claim_value, claim_type, injuries, description)
                  
                  # Save claim to DynamoDB with AI analysis
                  claim_record = {
                      'claimId': claim_id,
                      'version': 'v1',
                      'claimantInfo': {
                          'name': body.get('claimantName', ''),
                          'email': body.get('claimantEmail', ''),
                          'phone': body.get('claimantPhone', ''),
                          'address': body.get('claimantAddress', '')
                      },
                      'policyNumber': body.get('policyNumber', ''),
                      'claimType': claim_type,
                      'incidentDate': body.get('incidentDate', ''),
                      'incidentDescription': description,
                      'claimValue': Decimal(str(claim_value)),
                      'policeReport': body.get('policeReport'),
                      'injuries': injuries,
                      'injuryDescription': body.get('injuryDescription'),
                      'status': 'assigned',
                      'aiRecommendation': ai_analysis['recommendation'],
                      'aiConfidence': ai_analysis['confidence'],
                      'aiReasoning': ai_analysis['reasoning'],
                      'riskFactors': ai_analysis['riskFactors'],
                      'submittedDate': timestamp.isoformat(),
                      'lastUpdated': timestamp.isoformat()
                  }
                  
                  claims_table.put_item(Item=claim_record)
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({
                          'success': True,
                          'claimId': claim_id,
                          'message': f"Claim {claim_id} submitted successfully"
                      })
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({
                          'success': False,
                          'error': str(e)
                      })
                  }

  GetClaimsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-GetClaims-${DeploymentID}"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from boto3.dynamodb.conditions import Attr

          dynamodb = boto3.resource('dynamodb')
          claims_table = dynamodb.Table(os.environ['CLAIMS_TABLE'])

          def lambda_handler(event, context):
              try:
                  params = event.get('queryStringParameters', {}) or {}
                  claim_id = event.get('pathParameters', {}).get('claimId') if event.get('pathParameters') else None
                  
                  if claim_id:
                      response = claims_table.get_item(Key={'claimId': claim_id})
                      claim = response.get('Item')
                      
                      if not claim:
                          return {
                              'statusCode': 404,
                              'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                              'body': json.dumps({'success': False, 'error': 'Claim not found'})
                          }
                      
                      return {
                          'statusCode': 200,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'success': True, 'claim': claim}, default=str)
                      }
                  
                  # Get all claims
                  response = claims_table.scan()
                  claims = response.get('Items', [])
                  claims.sort(key=lambda x: x.get('submittedDate', ''), reverse=True)
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'success': True, 'claims': claims, 'count': len(claims)}, default=str)
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'success': False, 'error': str(e)})
                  }

  ApproveClaimFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-ApproveClaim-${DeploymentID}"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          AUDIT_TABLE: !Ref AuditTrailTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          claims_table = dynamodb.Table(os.environ['CLAIMS_TABLE'])
          audit_table = dynamodb.Table(os.environ['AUDIT_TABLE'])

          def lambda_handler(event, context):
              try:
                  body = json.loads(event.get('body', '{}'))
                  claim_id = body.get('claimId')
                  reviewer_id = body.get('reviewerId')
                  notes = body.get('notes', '')
                  
                  if not claim_id or not reviewer_id:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'success': False, 'error': 'claimId and reviewerId are required'})
                      }
                  
                  timestamp = datetime.utcnow().isoformat()
                  
                  # Update claim status
                  claims_table.update_item(
                      Key={'claimId': claim_id},
                      UpdateExpression='SET #status = :status, finalDecision = :decision, reviewedDate = :reviewed, lastUpdated = :updated',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'approved',
                          ':decision': 'approve',
                          ':reviewed': timestamp,
                          ':updated': timestamp
                      }
                  )
                  
                  # Log to audit trail
                  audit_table.put_item(Item={
                      'claimId': claim_id,
                      'timestamp': timestamp,
                      'action': 'claim_approved',
                      'actor': reviewer_id,
                      'actorType': 'reviewer',
                      'details': {'decision': 'approve', 'notes': notes}
                  })
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({
                          'success': True,
                          'claimId': claim_id,
                          'status': 'approved',
                          'message': f"Claim {claim_id} approved successfully"
                      })
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'success': False, 'error': str(e)})
                  }

  DenyClaimFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-DenyClaim-${DeploymentID}"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          AUDIT_TABLE: !Ref AuditTrailTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          claims_table = dynamodb.Table(os.environ['CLAIMS_TABLE'])
          audit_table = dynamodb.Table(os.environ['AUDIT_TABLE'])

          def lambda_handler(event, context):
              try:
                  body = json.loads(event.get('body', '{}'))
                  claim_id = body.get('claimId')
                  reviewer_id = body.get('reviewerId')
                  reason = body.get('reason', '')
                  
                  if not claim_id or not reviewer_id or not reason:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'success': False, 'error': 'claimId, reviewerId, and reason are required'})
                      }
                  
                  timestamp = datetime.utcnow().isoformat()
                  
                  # Update claim status
                  claims_table.update_item(
                      Key={'claimId': claim_id},
                      UpdateExpression='SET #status = :status, finalDecision = :decision, decisionReason = :reason, reviewedDate = :reviewed, lastUpdated = :updated',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'denied',
                          ':decision': 'deny',
                          ':reason': reason,
                          ':reviewed': timestamp,
                          ':updated': timestamp
                      }
                  )
                  
                  # Log to audit trail
                  audit_table.put_item(Item={
                      'claimId': claim_id,
                      'timestamp': timestamp,
                      'action': 'claim_denied',
                      'actor': reviewer_id,
                      'actorType': 'reviewer',
                      'details': {'decision': 'deny', 'reason': reason}
                  })
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({
                          'success': True,
                          'claimId': claim_id,
                          'status': 'denied',
                          'message': f"Claim {claim_id} denied"
                      })
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'success': False, 'error': str(e)})
                  }

  ReassignClaimFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-ReassignClaim-${DeploymentID}"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          REVIEWERS_TABLE: !Ref ReviewersTable
          AUDIT_TABLE: !Ref AuditTrailTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          claims_table = dynamodb.Table(os.environ['CLAIMS_TABLE'])
          audit_table = dynamodb.Table(os.environ['AUDIT_TABLE'])

          def lambda_handler(event, context):
              try:
                  body = json.loads(event.get('body', '{}'))
                  claim_id = body.get('claimId')
                  to_reviewer_id = body.get('toReviewerId')
                  reason = body.get('reason', 'Reassignment requested')
                  
                  if not claim_id or not to_reviewer_id:
                      return {
                          'statusCode': 400,
                          'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                          'body': json.dumps({'success': False, 'error': 'claimId and toReviewerId are required'})
                      }
                  
                  timestamp = datetime.utcnow().isoformat()
                  
                  # Update claim assignment
                  claims_table.update_item(
                      Key={'claimId': claim_id},
                      UpdateExpression='SET assignedTo = :reviewer, assignedDate = :date, lastUpdated = :updated',
                      ExpressionAttributeValues={
                          ':reviewer': to_reviewer_id,
                          ':date': timestamp,
                          ':updated': timestamp
                      }
                  )
                  
                  # Log to audit trail
                  audit_table.put_item(Item={
                      'claimId': claim_id,
                      'timestamp': timestamp,
                      'action': 'claim_reassigned',
                      'actor': 'system',
                      'actorType': 'reviewer',
                      'details': {'toReviewer': to_reviewer_id, 'reason': reason}
                  })
                  
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({
                          'success': True,
                          'claimId': claim_id,
                          'assignedTo': to_reviewer_id,
                          'message': f"Claim {claim_id} reassigned successfully"
                      })
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                      'body': json.dumps({'success': False, 'error': str(e)})
                  }

  # API Gateway
  LegalServiceAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "LegalServiceManagementAPI-${DeploymentID}"
      Description: API for AI-Powered Legal Service Management System
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resources and Methods
  SubmitClaimResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ParentId: !GetAtt LegalServiceAPI.RootResourceId
      PathPart: submit-claim

  SubmitClaimMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ResourceId: !Ref SubmitClaimResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitClaimFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  SubmitClaimOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ResourceId: !Ref SubmitClaimResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,x-api-key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ClaimsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ParentId: !GetAtt LegalServiceAPI.RootResourceId
      PathPart: claims

  ClaimsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ResourceId: !Ref ClaimsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetClaimsFunction.Arn}/invocations"

  ClaimsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ResourceId: !Ref ClaimsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,x-api-key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ClaimIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref LegalServiceAPI
      ParentId: !Ref ClaimsResource
      PathPart: "{claimId}"

  ClaimIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref LegalServiceAPI
