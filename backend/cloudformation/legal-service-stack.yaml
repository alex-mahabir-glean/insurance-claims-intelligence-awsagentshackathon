  # Lambda Function: Approve Claim (Direct Action)
  ApproveClaimFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-ApproveClaim-${DeploymentID}"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CLAIMS_TABLE: !Ref ClaimsTable
          AUDIT_TABLE: !Ref AuditTrailTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          claims_table = dynamodb.Table(os.environ['CLAIMS_TABLE'])
          audit_table = dynamodb.Table(os.environ['AUDIT_TABLE'])

          def lambda_handler(event, context):
              headers = {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                  'Access-Control-Allow-Methods': 'POST,OPTIONS'
              }
              
              try:
                  if event.get('httpMethod') == 'OPTIONS':
                      return {'statusCode': 200, 'headers': headers, 'body': ''}
                  
                  body = json.loads(event.get('body', '{}'))
                  
                  # Validate required fields
                  required_fields = ['claimId', 'reviewerId']
                  missing_fields = [field for field in required_fields if not body.get(field)]
                  
                  if missing_fields:
                      return {
                          'statusCode': 400,
                          'headers': headers,
                          'body': json.dumps({
                              'success': False,
                              'error': f'Missing required fields: {", ".join(missing_fields)}'
                          })
                      }
                  
                  claim_id = body['claimId']
                  reviewer_id = body['reviewerId']
                  notes = body.get('notes', 'Claim approved by reviewer')
                  timestamp = datetime.utcnow().isoformat()
                  
                  # Check if claim exists
                  response = claims_table.get_item(Key={'claimId': claim_id})
                  if 'Item' not in response:
                      return {
                          'statusCode': 404,
                          'headers': headers,
                          'body': json.dumps({'success': False, 'error': 'Claim not found'})
                      }
                  
                  # Update claim status
                  claims_table.update_item(
                      Key={'claimId': claim_id},
                      UpdateExpression='SET #status = :status, finalDecision = :decision, decisionReason = :reason, reviewedDate = :reviewed, lastUpdated = :updated',
                      ExpressionAttributeNames={'#status': 'status'},
                      ExpressionAttributeValues={
                          ':status': 'approved',
                          ':decision': 'approve',
                          ':reason': notes,
                          ':reviewed': timestamp,
                          ':updated': timestamp
                      }
                  )
                  
                  # Log to audit trail
                  audit_record = {
                      'auditId': f"AUDIT-{datetime.utcnow().strftime('%Y%m%d%H%M%S')}",
                      'claimId': claim_id,
                      'action': 'approve',
                      'performedBy': reviewer_id,
                      'timestamp': timestamp,
                      'details': {
                          'notes': notes,
                          'previousStatus': 'under_review',
                          'newStatus': 'approved'
                      }
                  }
                  audit_table.put_item(Item=audit_record)
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({
                          'success': True,
                          'claimId': claim_id,
                          'status': 'approved',
                          'message': f'Claim {claim_id} approved successfully'
                      })
                  }
                  
              except Exception as e:
                  print(f"Error approving claim: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'success': False, 'error': f'Failed to approve claim: {str(e)}'})
                  }

