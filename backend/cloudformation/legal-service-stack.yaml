  # Lambda Authorizer Function
  AgentCoreAuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-AgentCoreAuthorizer-${DeploymentID}"
      Handler: index.lambda_handler
      Role: !GetAtt AgentCoreAuthorizerLambdaRole.Arn
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          API_KEY_SECRET_ARN: !Ref AgentCoreApiTokenSecret
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          secretsmanager = boto3.client('secretsmanager')
          API_KEY_SECRET_ARN = os.environ['API_KEY_SECRET_ARN']
          cached_api_key = None

          def lambda_handler(event, context):
              logger.info("AgentCore Authorizer Lambda triggered")
              
              headers = event.get('headers', {})
              # Check for x-api-key header (case-insensitive)
              api_key = headers.get('x-api-key') or headers.get('X-Api-Key') or headers.get('X-API-KEY')
              
              # Fallback to Authorization header for backward compatibility
              if not api_key:
                  auth_header = headers.get('Authorization') or headers.get('authorization')
                  if auth_header:
                      try:
                          api_key = auth_header.split(' ')[1] if ' ' in auth_header else auth_header
                      except IndexError:
                          pass
              
              if not api_key:
                  logger.error("No x-api-key or Authorization header found")
                  raise Exception('Unauthorized')
              
              method_arn = event['methodArn']
              
              if validate_token(api_key):
                  logger.info("Token is valid, allowing access")
                  return generate_policy(api_key, 'Allow', method_arn)
              else:
                  logger.error("Token is invalid, denying access")
                  return generate_policy(api_key, 'Deny', method_arn)

          def validate_token(token):
              global cached_api_key
              
              if not cached_api_key:
                  try:
                      response = secretsmanager.get_secret_value(SecretId=API_KEY_SECRET_ARN)
                      secret_data = json.loads(response['SecretString'])
                      cached_api_key = secret_data['token']
                      logger.info("API key retrieved and cached")
                  except Exception as e:
                      logger.error(f"Failed to retrieve API key: {str(e)}")
                      return False
              
              return token == cached_api_key

          def generate_policy(token, effect, method_arn):
              principal_id = 'user'
              if token:
                  principal_id = f"user-{token[:8]}"
              
              arn_parts = method_arn.split(':')
              region = arn_parts[3]
              account_id = arn_parts[4]
              api_gateway_arn_part = arn_parts[5]
              
              api_id = api_gateway_arn_part.split('/')[0]
              stage = api_gateway_arn_part.split('/')[1]
              
              resource_arn = f"arn:aws:execute-api:{region}:{account_id}:{api_id}/{stage}/*/*"
              
              logger.info(f"Generated policy resource ARN: {resource_arn}")
              
              return {
                  'principalId': principal_id,
                  'policyDocument': {
                      'Version': '2012-10-17',
                      'Statement': [{
                          'Action': 'execute-api:Invoke',
                          'Effect': effect,
                          'Resource': resource_arn
                      }]
                  }
              }

  # Lambda Function: Invoke Intake Agent (AgentCore Chat)
  InvokeIntakeAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "LegalService-InvokeIntakeAgent-${DeploymentID}"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt AgentCoreProxyLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INTAKE_AGENT_ARN: "placeholder-will-be-updated-by-deployment-script"
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          agentcore_client = boto3.client('bedrock-agentcore', region_name='us-east-1')
          INTAKE_AGENT_ARN = os.environ.get('INTAKE_AGENT_ARN')

          def lambda_handler(event, context):
              headers = {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                  'Access-Control-Allow-Methods': 'POST,OPTIONS'
              }
              
              try:
                  if event.get('httpMethod') == 'OPTIONS':
                      return {'statusCode': 200, 'headers': headers, 'body': ''}
                  
                  body = json.loads(event.get('body', '{}'))
                  user_prompt = body.get('prompt', '')
                  session_id = body.get('sessionId', f'session-{int(datetime.now().timestamp() * 1000000)}')
                  
                  if len(session_id) < 33:
                      session_id = f"{session_id}-{'0' * (33 - len(session_id))}"
                  
                  if not user_prompt:
                      return {
                          'statusCode': 400,
                          'headers': headers,
                          'body': json.dumps({'success': False, 'error': 'Missing required field: prompt'})
                      }
                  
                  agent_payload = json.dumps({"prompt": user_prompt}).encode('utf-8')
                  
                  response = agentcore_client.invoke_agent_runtime(
                      agentRuntimeArn=INTAKE_AGENT_ARN,
                      runtimeSessionId=session_id,
                      contentType='application/json',
                      accept='application/json',
                      payload=agent_payload
                  )
                  
                  response_body = response['response'].read().decode('utf-8')
                  
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({
                          'success': True,
                          'response': response_body,
                          'sessionId': session_id
                      })
                  }
                  
              except Exception as e:
                  print(f"Error invoking intake agent: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({
                          'success': False,
                          'error': str(e)
                      })
                  }

